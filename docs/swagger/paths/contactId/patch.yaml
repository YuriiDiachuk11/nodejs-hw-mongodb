tags:
  - Contacts

summary: Update a contact
operationId: updateContact
description: Update an existing contact's details.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
    example: '679ca01a791a37e1a64e5d7b'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas/contact.yaml'

responses:
  '200':
    description: Contact successfully updated
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Contact successfully updated!'
            data:
              $ref: '../../components/schemas/contact.yaml'
  '400':
    description: Bad request
    content:
      application/json:
        schema:
          $ref: '../../components/responses/400.yaml'
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          $ref: '../../components/responses/404.yaml'
  '500':
    description: Internal server error
    content:
      application/json:
        schema:
          $ref: '../../components/responses/500.yaml'
