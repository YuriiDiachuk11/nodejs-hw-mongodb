openapi: 3.0.3
info:
  version: 1.0.0
  title: Contacts-Manager-App
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: This is a documentation of Contacts-Manager-App
tags:
  - name: Contacts
    description: Operations about contacts.
  - name: Auth
    description: Auth operations.
servers:
  - url: http://localhost:3000
paths:
  /contacts/{contactId}:
    get:
      tags:
        - Contacts
      summary: Get contact by ID
      operationId: getContact
      description: Retrieve a specific contact by its ID.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: contactId
          required: true
          schema:
            type: string
          example: '679ca01a791a37e1a64e5d7b'
      responses:
        '200':
          description: Successfully found the contact
          content:
            application/json:
              schema:
                $ref: '../swagger/components/schemas/contact.yaml'
        '404':
          description: Contact not found
          content:
            application/json:
              schema:
                $ref: '../swagger/components/responses/404.yaml'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
