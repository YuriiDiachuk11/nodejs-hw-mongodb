openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts Manager App
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: Contacts operations

tags:
  - name: Contacts
    description: Operations with contacts

servers:
  - url: http://localhost:3000
  - url: https://contacts-manager-app-email-and-images.onrender.com

paths:
  /contacts:
    get:
      $ref: '../swagger/paths/contacts/get.yaml'
    post:
      $ref: '../swagger/paths/contacts/post.yaml'
  /contacts/{contactId}:
    get:
      $ref: '../swagger/paths/contacts/{id}/get.yaml'
    patch:
      $ref: '../swagger/paths/contacts/{id}/patch.yaml'
    delete:
      $ref: '../swagger/paths/contacts/{id}/delete.yaml'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    400:
      $ref: '../swagger/components/responses/400.yaml'
    401:
      $ref: '../swagger/components/responses/401.yaml'
    404:
      $ref: '../swagger/components/responses/404.yaml'
    500:
      $ref: '../swagger/components/responses/500.yaml'
  schemas:
    contact:
      $ref: '../swagger/components/schemas/contact.yaml'
