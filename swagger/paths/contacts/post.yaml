tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Add a new contact to the list.
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
      properties:
        name:
          description: "Contact's name"
          type: string
          example: 'Ivan Pele'
        phoneNumber:
          description: Contact's phone
          type: string
          example: '+380975554532'
        contactType:
          description: "Contact's type"
          enum: ['work', 'personal', 'home']

responses:
  '201':
    description: Successfully created a new contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: '201'
            message:
              type: string
              example: Successfully created a contact
            data:
              type: object
              $ref: ../../components/schemas/contact.yaml
    '401':
      $ref: ../../components/responses/401.yaml
