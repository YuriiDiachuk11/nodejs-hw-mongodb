tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: Retrieve a list of all contacts with pagination, sorting, and filtering.
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    required: false
    schema:
      type: integer
      default: 1
    description: The page number.
  - in: query
    name: perPage
    required: false
    schema:
      type: integer
      default: 10
    description: Number of items per page.
  - in: query
    name: sortBy
    required: false
    schema:
      type: string
      default: 'name'
    description: The field to sort by ('name', 'phoneNumber').
  - in: query
    name: sortOrder
    required: false
    schema:
      type: string
      enum:
        - asc
        - desc
      default: 'desc'
    description: The sorting order ('asc' or 'desc').
  - in: query
    name: type
    required: false
    schema:
      type: string
      enum:
        - work
        - home
        - personal
    description: Filter by contact type.
  - in: query
    name: isFavourite
    required: false
    schema:
      type: boolean
    description: Filter by favorite status.
responses:
  '200':
    description: Successfully retrieved the contacts list
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully found contacts!'
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/contact.yaml'
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalItems:
                  type: integer
                  example: 15
                totalPages:
                  type: integer
                  example: 10
                hasNextPage:
                  type: boolean
                  example: true
                hasPreviousPage:
                  type: boolean
                  example: false
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '../../components/responses/401.yaml'
  '500':
    description: Internal server error
    content:
      application/json:
        schema:
          $ref: '../../components/responses/500.yaml'
