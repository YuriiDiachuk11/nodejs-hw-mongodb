tags:
  - Contacts
summary: Delete a contact by ID
operationId: deleteContact
description: Remove a specific contact by its ID.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
    example: '679ca01a791a37e1a64e5d7b'
responses:
  '200':
    description: Successfully deleted the contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Contact successfully deleted'
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '../../components/responses/401.yaml'
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          $ref: '../../components/responses/404.yaml'
  '500':
    description: Internal server error
    content:
      application/json:
        schema:
          $ref: '../../components/responses/500.yaml'
